services:
  - type: web
    name: quantum-os-signaling
    runtime: node
    rootDir: packages/signaling
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Starter, not Free: the free instance sleeps after 15min idle, and a cold
    # start on the next connect is what showed up in every peer's log as
    # `signaling dropped (1006)` → reconnect churn — indistinguishable from a
    # network problem until you know to look here. Starter is plenty for a
    # small WebSocket relay; nothing here needs more.
    #
    # This line documents the intent for a future blueprint-recreate — it does
    # NOT change the live service. quantum-os-signaling was hand-created, not
    # deployed from this blueprint (see the autoDeploy note below), so Render
    # ignores render.yaml's settings for it. The plan change has to be made in
    # the dashboard: the SERVICE's Settings -> Instance Type (not the
    # workspace plan — "Pro" there changes nothing about cold starts). If the
    # dashboard offers no paid instance type, two ways out: an external HTTP
    # pinger hitting GET / every 10 min (a WebSocket ping does not count as
    # inbound traffic for the idle timer), or `fly deploy` from
    # packages/signaling — its fly.toml is already an always-on config
    # (auto_stop_machines off, min_machines_running 1).
    #
    # 2026-09-18: the resume/relay build makes a restart a blip rather than a
    # room-wide storm (docs/connection.md "The transport"), but a host that
    # sleeps still costs every peer its socket every time it wakes.
    plan: starter
    envVars:
      - key: PORT
        generateValue: false
      # A peer joining a room of N sends N-1 offers and then a burst of ICE
      # candidates, so the per-connection message rate during a join is
      # superlinear in room size. At the code default of 20/s the window blows
      # at about four peers and handshakes stop completing — while every peer
      # still appears in the room, which is indistinguishable from the others
      # never having arrived. 200/s holds a full cast; the messages are small
      # and the 256 KB payload cap and wsIndex relay auth are what actually
      # guard the server.
      - key: SIGNAL_RATE_LIMIT
        value: "200"
      # How long a seat is held after its socket dies before the room is told
      # the peer left (a rejoin inside it is a silent resume). Code default
      # 60000. The clients reconnect from 1.5-3s and double on failure, so a
      # seat is only missed when the server itself was unreachable for most
      # of the window — in which case it restarted and the seat is gone anyway.
      - key: SIGNAL_GRACE_MS
        value: "60000"
      # Cloudflare Realtime TURN Service credentials — mint short-lived relay
      # credentials for GET /turn (packages/signaling/src/turn.ts), which is
      # what makes a call work between two peers who can't form a direct ICE
      # pair (see CLAUDE.md "Calls must work across networks"). `sync: false`
      # means the VALUE lives only in the Render dashboard (Environment tab),
      # never in this file or the repo — these two lines document that the
      # keys are required, not what they are. Missing entirely: /turn still
      # answers (with no relay), it just can't help a cross-network call.
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_KEY_API_TOKEN
        sync: false
    # On, but it must only fire for changes to this server.
    #
    # A deploy restarts signaling, and a restart drops every peer's socket at
    # once — the whole room reconnecting together because somebody edited a help
    # string in the browser. Pages should deploy on every push (a reload is one
    # person's choice, taken when they choose it); this is everybody's.
    #
    # The control is Render's **Build Filters** (Settings -> Build & Deploy),
    # since a service Render did not create from this blueprint ignores the file:
    #
    #   Included Paths:  packages/signaling/**
    #                    render.yaml
    #
    # Included rather than ignored, so anything new in the repo defaults to not
    # restarting the room.
    autoDeploy: true
