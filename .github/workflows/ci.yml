name: CI

on:
  push:
    # `work` is where changes land first; `main` is what is deployed. Both are
    # checked, so a merge to main is never the first time anything is run.
    branches: [main, work]
  pull_request:
    branches: [main, work]

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Run tests
        run: cargo test --workspace

  wasm:
    name: WASM build + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Build WASM kernel
        run: pnpm build:wasm

      - name: Install JS dependencies
        run: pnpm install

      - name: Build signaling server
        run: pnpm build:signaling

      - name: Typecheck browser
        run: pnpm --filter @quantum-os/browser typecheck

      # The macro language is plain JS so it runs under node with no build,
      # which is the whole reason it is plain JS: its tests are the only ones
      # covering the two lexers and the expander.
      - name: Macro language selftest
        run: node packages/browser/src/macro-lang.js --selftest

      - name: Capability macro selftest
        run: node scripts/qos-cli/rholang-macros.mjs --selftest

      - name: Locker selftest
        run: node packages/browser/src/locker.js --selftest

      # The room key and hashed room id (room-crypto.js) — the one file the
      # browser and the Node agents both run, so one derivation, not two.
      - name: Room crypto selftest
        run: node packages/browser/src/room-crypto.js --selftest

      # The signaling server over real sockets: the `data` relay and its
      # sender check, the seat held through a lost socket, the silent resume
      # with replay, departure only on grace expiry or an explicit leave.
      - name: Signaling server test
        run: node --test packages/signaling/test/server.test.mjs

      # The pooled token exchange contract (open/provide/swap/… + the atomic
      # cross-shard 2PC verbs) and its `$x*` macro call-site shape. Shape
      # only; live-node behaviour is verified manually against localnet.
      - name: Exchange selftest
        run: node packages/browser/src/rholang-exchange.js --selftest

      # The wrapped-native-token contract + $wrap/$unwrap/$wrelease macro
      # call-site shape. Same scope as the exchange selftest above.
      - name: Wrapped token selftest
        run: node packages/browser/src/wrapped-token.js --selftest

      # The cross-shard trade recovery decision table (exchange-2pc.ts) —
      # pure, so this is exhaustive over every reachable (local, remote)
      # status pair, not shape-only.
      - name: Exchange 2PC recovery test
        run: node packages/browser/test/exchange-2pc.test.mjs

      # Browser behaviour, against stubbed media. Not a rendering test — it
      # asserts which track ends up in the stream a joiner would be given.
      - name: Calls test
        run: node packages/browser/test/calls.test.mjs

      # The browser peer against a stubbed clock, socket and RTCPeerConnection:
      # the retry sweep (wrong twice from live rooms), and the relayed control
      # plane — sealed frames, in-order queueing through a socket blip,
      # onPeerReady on a fresh join but not a resume, a dead data channel not
      # being a departure.
      - name: Peer transport test
        run: node packages/browser/test/peer.test.mjs

      # The posix-net socket macro layer (connect/listen/accept/send/close),
      # against a fake two-peer mesh — no WebRTC or QOSPeer involved, since
      # posix-net.ts only ever talks to the injected SocketTransport interface.
      - name: POSIX-net socket test
        run: node packages/browser/test/posix-net.test.mjs

      # The local /search + /solve enumerator (#119) — possibilities/events
      # shapes, the listener rollups, the /solve cascade, and a conformance
      # block of digests captured from quantum-logical-framework's
      # qucalc_search.py so the TS port cannot silently drift.
      - name: QuCalc search test
        run: node packages/browser/test/qucalc-search.test.mjs

  docs:
    name: Document network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The docs are a network with README.md as its hub (quantum-os#116). This
      # fails on an orphaned root/docs .md, a dead relative link, or a #anchor
      # that names no heading — seconds, no dependencies.
      - name: Check the document network
        run: python3 scripts/doc_network_check.py
